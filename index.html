<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engagement Rate Calculator — Sucii</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2>📈 Engagement Rate Calculator</h2>
      <p>Hitung persentase keterlibatan audiens di akun media sosial kamu.</p>
    </div>

    <form id="er-form">
      <div class="form-group">
        <label for="followers">Total Pengikut / Followers</label>
        <input type="number" id="followers" placeholder="Contoh: 10000" required>
      </div>

      <div class="form-group">
        <label for="likes">Rata-rata Likes per Post</label>
        <input type="number" id="likes" placeholder="Contoh: 500" required>
      </div>

      <div class="form-group">
        <label for="comments">Rata-rata Komentar per Post</label>
        <input type="number" id="comments" placeholder="Contoh: 50" required>
      </div>

      <button type="submit" class="btn">Hitung Engagement Rate</button>
    </form>

    <div id="result-box" class="result-box hidden">
      <h3>Hasil Analisis ER</h3>
      <div class="result-item">
        <span>Engagement Rate:</span>
        <strong id="er-score">0%</strong>
      </div>
      <div class="result-item">
        <span>Kategori:</span>
        <strong id="er-category">-</strong>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('er-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const followers = parseFloat(document.getElementById('followers').value) || 0;
      const likes = parseFloat(document.getElementById('likes').value) || 0;
      const comments = parseFloat(document.getElementById('comments').value) || 0;

      if (followers <= 0) {
        alert('Jumlah followers harus lebih dari 0!');
        return;
      }

      const totalInteractions = likes + comments;
      const er = ((totalInteractions / followers) * 100).toFixed(2);

      const scoreEl = document.getElementById('er-score');
      const catEl = document.getElementById('er-category');

      scoreEl.textContent = er + '%';

      if (er < 1) {
        catEl.textContent = 'Rendah 🔴';
        catEl.style.color = '#f87171';
      } else if (er <= 3.5) {
        catEl.textContent = 'Rata-rata / Bagus 🟡';
        catEl.style.color = '#fbbf24';
      } else {
        catEl.textContent = 'Sangat Tinggi 🟢';
        catEl.style.color = '#34d399';
      }

      document.getElementById('result-box').classList.remove('hidden');
    });
  </script>
</body>
</html>
